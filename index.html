<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Kagamitang Pampagtuturo</title>

<style>
/* BODY */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8;
    color: #333;
    overflow-x: hidden;
}

/* NAVBAR */
nav {
    background: #2c3e50;
    padding: 15px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
}

nav a {
    color: white;
    margin: 0 20px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
}

nav a:hover {
    color: #f1c40f;
    transform: scale(1.1);
}

/* HEADER */
header {
    background: linear-gradient(270deg, #3498db, #1abc9c, #2c3e50);
    background-size: 600% 600%;
    color: white;
    padding: 80px 20px;
    text-align: center;
    animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

header h1 {
    font-size: 3em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
}

header p {
    font-size: 1.2em;
}

/* SECTION */
section {
    max-width: 800px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    animation: fadeUp 1s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

section h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #2c3e50;
    font-size: 2em;
}

/* IMAGE */
.main-img {
    width: 100%;
    max-width: 500px;
    display: block;
    margin: 20px auto;
    border-radius: 20px;
    transition: transform 0.5s ease, box-shadow 0.5s ease;
}

.main-img:hover {
    transform: scale(1.08) rotate(2deg);
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
}

/* BUTTON */
button {
    display: block;
    margin: 25px auto;
    padding: 15px 30px;
    background: linear-gradient(45deg, #3498db, #1abc9c);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1em;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

button:hover {
    background: linear-gradient(45deg, #1abc9c, #3498db);
    transform: scale(1.15);
    box-shadow: 0 12px 35px rgba(0,0,0,0.3);
}

/* TEXT ANIMATION */
#text {
    text-align: center;
    font-size: 1.3em;
    color: #e74c3c;
    min-height: 50px;
    margin-top: 15px;
    transition: 0.5s;
}

/* FOOTER */
footer {
    background: #2c3e50;
    color: white;
    text-align: center;
    padding: 20px;
    font-weight: 500;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Lessons</a>
</nav>

<!-- HEADER -->
<header>
    <h1>E-Kagamitang Pampagtuturo</h1>
    <p>Baitang 8 - Filipino</p>
</header>

<!-- CONTENT -->
<section>
    <h2>Tungkol sa Aralin</h2>

    <img src="image1.jpg" class="main-img" alt="Larawan">

    <p>
        Ang larawang ito ay sumisimbolo sa kagandahan ng panitikan—
        tulad ng isang bulaklak, ito ay may lalim, damdamin, at kahulugan.
    </p>

    <button onclick="showText()">Ipakita ang Mensahe</button>

    <p id="text"></p>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 E-Kagamitang Pampagtuturo</p>
</footer>

<script>
function showText() {
    document.getElementById("text").innerHTML = 
    "🌸 Ang bulaklak ay sumasayaw sa hangin, tulad ng damdamin sa isang tula...";
}
</script>

</body>
</html>
